# Quality gate, mirrored from local development: every step is a one-line
# pass-through to a `mise` task, so CI and a developer machine cannot diverge
# on what "green" means. Tool versions come from mise.toml and uv.lock.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: mise run check:static + cov:xml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Docling pulls torch with its CUDA wheels from PyPI (~6 GB installed).
      # The hosted runner's free disk is tight for that, so drop preinstalled
      # toolchains this job never uses.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise + tooling
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.6.10
          experimental: true
          install: true
          cache: true

      - name: Sync dependencies (all extras + dev group)
        run: uv sync --frozen --all-extras --all-groups

      - name: mise run check:static (lint / format / typecheck)
        run: mise run "check:static"

      # Unit suite is hermetic: HF_HUB_OFFLINE=1 is forced by pyproject, and
      # the live Ollama lane self-skips without RUN_INTEGRATION_OLLAMA=1.
      - name: mise run cov:xml (pytest + coverage ratchet)
        run: mise run "cov:xml"

      - name: mise run pre-commit:validate
        run: mise run "pre-commit:validate"
